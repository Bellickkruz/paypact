[package]
name = "test-token"
version = "0.1.0"
edition = "2021"
description = "Test-only NEP-141 token standing in for USDC on testnet"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
