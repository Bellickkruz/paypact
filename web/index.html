<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light by default. Apply a saved dark choice before the page paints, so it never flashes.
      try {
        var t = localStorage.getItem("paypact:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>PayPact: get paid safely, from anyone, on any crypto</title>
    <meta name="description" content="Send an invoice link. Your client pays with any crypto on any chain. The money is locked safely until the work is done." />
    <meta property="og:title" content="PayPact: get paid safely, from anyone, on any crypto" />
    <meta property="og:description" content="Invoice links with escrow on NEAR. Pay with any crypto, money held safely until the job is done." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
